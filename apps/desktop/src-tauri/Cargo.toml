[package]
name = "rabbit-code-desktop"
version = "3.0.0"
description = "Rabbit Code desktop shell"
authors = ["Rabbit Code Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rabbit_code_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
