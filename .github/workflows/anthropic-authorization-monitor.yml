name: Anthropic authorization monitor

on:
  schedule:
    - cron: "0 9 1 1,4,7,10 *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install monitor dependency
        run: python -m pip install pyyaml
      # RC ID: RC-029
      - name: Check Anthropic repository metadata
        run: python scripts/check_anthropic_authorization_monitor.py --live
