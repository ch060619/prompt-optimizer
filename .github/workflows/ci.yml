name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RABBIT_CODE_REAL_PROVIDER_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e backend[dev]
      - name: Compile backend
        run: python -m compileall -q backend/src
      # RC ID: RC-043
      - name: RC traceability
        run: python scripts/check_rc_traceability.py --check
      # RC ID: RC-271
      - name: Documentation links, assets, and smoke commands
        run: python scripts/check_docs.py --run
      # RC ID: RC-066
      - name: Dependency boundaries
        run: python scripts/check_dependency_boundaries.py
      # RC ID: RC-062
      - name: Generated API drift
        run: python scripts/generate_api.py --check
      # RC ID: RC-015
      - name: Source baseline
        run: python scripts/check_source_baselines.py --check
      # RC ID: RC-023
      - name: Source-map denylist
        run: |
          python scripts/check_source_map_denylist.py
          python scripts/test_source_map_denylist.py
      # RC ID: RC-024
      - name: Proprietary-content policy
        run: python scripts/check_proprietary_content_policy.py
      # RC ID: RC-026
      - name: Independent design provenance
        run: python scripts/check_independent_design.py
      # RC ID: RC-027
      - name: Black-box fixture contract
        run: python scripts/check_claude_black_box_fixtures.py
      # RC ID: RC-028
      - name: MIT analysis source audit
        run: python scripts/check_mit_analysis_source_audit.py
      # RC ID: RC-030
      - name: M0 clean-room decision record
        run: python scripts/check_m0_clean_room_decision.py
      # RC ID: RC-031
      - name: Local-model license manifest
        run: python scripts/check_local_model_license_manifest.py
      # RC ID: RC-032
      - name: Third-party register
        run: python scripts/check_third_party_register.py --check
      # RC ID: RC-033
      - name: Clean-room rewrite workflow
        run: python scripts/check_clean_room_rewrite.py
      # RC ID: RC-034
      - name: Name and channel audit
        run: python scripts/check_name_channel_audit.py
      # RC ID: RC-035
      - name: Rabbit artwork license gate
        run: python scripts/check_rabbit_art_license.py
      # RC ID: RC-036
      - name: Research delivery summary
        run: python scripts/check_rc036_research_summary.py
      # RC ID: RC-037
      - name: Persona contract
        run: python scripts/check_personas.py
      # RC ID: RC-211
      - name: Security baseline and SBOM
        run: python scripts/security_scan.py --check
      # RC ID: RC-215
      - name: Structured log schema and redaction
        run: python scripts/check_structured_logging.py
      # RC ID: RC-211
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit
      - name: Ruff
        run: ruff check backend
      - name: Mypy
        run: mypy backend/src
      # RC ID: RC-173. Contract tests use MockTransport; real Provider tests are manual-only.
      - name: Provider Mock contract
        run: pytest backend/tests/test_rc173_provider_contracts.py -q
      - name: Pytest
        run: pytest --cov=prompt_optimizer --cov-report=term-missing --cov-report=json:docs/evidence/RC-243/coverage-report.json backend/tests
      # RC ID: RC-243
      - name: Coverage policy
        run: python scripts/check_rc243_coverage.py --check
      # RC ID: RC-229. Compare reproducible offline performance against the committed baseline.
      - name: Performance regression gate
        run: |
          python scripts/performance_baseline.py --iterations 25 --output performance-current.json --check
          python benchmarks/performance_gate.py --baseline docs/performance/baseline.json --current performance-current.json --comparison-output performance-comparison.json --check
      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-code-performance-${{ github.sha }}
          path: |
            performance-current.json
            performance-comparison.json

  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      # RC ID: RC-211
      - name: Production dependency audit
        working-directory: frontend
        run: npm run audit:production

  # RC ID: RC-280. Docker job: container build + API smoke test ONLY.
  # This does NOT replace desktop/CLI installation verification.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t rabbit-code-api:dev .
      - name: Start API container
        run: |
          docker run -d --name rabbit-code-test -p 127.0.0.1:8000:8000 rabbit-code-api:dev
          sleep 5
      - name: API smoke test
        run: |
          curl -sf http://127.0.0.1:8000/api/v1/health || exit 1
          echo "API health check passed"
      - name: Container non-root check
        run: |
          USER=$(docker exec rabbit-code-test whoami)
          if [ "$USER" = "root" ]; then
            echo "FAIL: container runs as root"
            exit 1
          fi
          echo "Container runs as: $USER"
      - name: Teardown
        if: always()
        run: docker rm -f rabbit-code-test || true

  # RC ID: RC-285. Automated license risk scan on every dependency change.
  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Scan license risks
        run: python scripts/scan_license_risks.py --check
