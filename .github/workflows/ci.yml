name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e backend[dev]
      # RC ID: RC-043
      - name: RC traceability
        run: python scripts/check_rc_traceability.py --check
      # RC ID: RC-015
      - name: Source baseline
        run: python scripts/check_source_baselines.py --check
      # RC ID: RC-023
      - name: Source-map denylist
        run: |
          python scripts/check_source_map_denylist.py
          python scripts/test_source_map_denylist.py
      # RC ID: RC-024
      - name: Proprietary-content policy
        run: python scripts/check_proprietary_content_policy.py
      # RC ID: RC-026
      - name: Independent design provenance
        run: python scripts/check_independent_design.py
      # RC ID: RC-027
      - name: Black-box fixture contract
        run: python scripts/check_claude_black_box_fixtures.py
      # RC ID: RC-028
      - name: MIT analysis source audit
        run: python scripts/check_mit_analysis_source_audit.py
      - name: Ruff
        run: ruff check backend
      - name: Mypy
        run: mypy backend/src
      - name: Pytest
        run: pytest --cov=prompt_optimizer --cov-report=term-missing backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
