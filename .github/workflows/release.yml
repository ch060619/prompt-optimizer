name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Determine channel from tag ──────────────────────────────────────
  resolve-channel:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.channel.outputs.version }}
    steps:
      - id: channel
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *"-nightly"* ]]; then
            echo "channel=nightly" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-beta"* || "$VERSION" == *"-rc"* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ── Build backend CLI wheel ─────────────────────────────────────────
  build-cli:
    needs: resolve-channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          pip install --upgrade pip build
          cd backend && python -m build --wheel
      - name: Generate checksums
        run: |
          cd backend/dist
          sha256sum *.whl > SHA256SUMS-cli.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cli-artifacts
          path: |
            backend/dist/*.whl
            backend/dist/SHA256SUMS-cli.txt

  # ── Build desktop installers (matrix) ───────────────────────────────
  build-desktop:
    needs: resolve-channel
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies for Tauri
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build desktop (Tauri)
        working-directory: apps/desktop
        run: npx @tauri-apps/cli@latest build
        env:
          SOURCE_DATE_EPOCH: "1700000000"
      - name: Collect and checksum
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.target }}" = "linux" ]; then
            cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
            cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
            cp apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm artifacts/ 2>/dev/null || true
          else
            cp apps/desktop/src-tauri/target/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
            cp apps/desktop/src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          fi
          ls -la artifacts/
          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "WARNING: No build artifacts found"
            exit 1
          fi
          cd artifacts
          sha256sum * > "SHA256SUMS-desktop-${{ matrix.target }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.target }}
          path: artifacts/

  # ── Generate SBOM and supply-chain manifest ─────────────────────────
  build-sbom:
    needs: resolve-channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e backend[dev]
      - name: Generate SBOM
        run: python scripts/generate_sbom.py
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: output/supply-chain/

  # ── Assemble and publish GitHub Release ─────────────────────────────
  publish:
    needs: [resolve-channel, build-cli, build-desktop, build-sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Assemble release directory
        run: |
          mkdir -p release
          # CLI
          cp release-assets/cli-artifacts/*.whl release/ 2>/dev/null || true
          cp release-assets/cli-artifacts/SHA256SUMS-cli.txt release/ 2>/dev/null || true
          # Desktop
          cp release-assets/desktop-artifacts-linux/* release/ 2>/dev/null || true
          cp release-assets/desktop-artifacts-windows/* release/ 2>/dev/null || true
          # SBOM
          cp release-assets/sbom-artifacts/sbom.json release/ 2>/dev/null || true
          cp release-assets/sbom-artifacts/provenance.json release/ 2>/dev/null || true
          cp release-assets/sbom-artifacts/licenses.json release/ 2>/dev/null || true
          cp release-assets/sbom-artifacts/artifacts.json release/ 2>/dev/null || true
          # License files
          cp LICENSE release/ 2>/dev/null || true
          cp NOTICE release/ 2>/dev/null || true
          cp THIRD_PARTY_NOTICES release/ 2>/dev/null || true

      - name: Generate release notes
        env:
          CHANNEL: ${{ needs.resolve-channel.outputs.channel }}
          VERSION: ${{ needs.resolve-channel.outputs.version }}
        run: python scripts/generate_release_notes.py --version "$VERSION" --channel "$CHANNEL" --output release/RELEASE_NOTES.md

      - name: Verify release checklist
        run: python scripts/check_rc279_github_release.py --release-dir release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release/RELEASE_NOTES.md
          files: release/*
          draft: ${{ needs.resolve-channel.outputs.channel != 'stable' }}
          prerelease: ${{ needs.resolve-channel.outputs.channel != 'stable' }}

  # ── Publish to PyPI (free, only for stable releases) ───────────────
  publish-pypi:
    needs: [resolve-channel, build-cli, publish]
    runs-on: ubuntu-latest
    if: needs.resolve-channel.outputs.channel == 'stable'
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-artifacts
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
