[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# RC ID: RC-061. Versioned protocol package follows the workspace release version.
name = "rabbit-code-protocol"
version = "3.0.0"
description = "Rabbit Code versioned cross-surface protocol models"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["rabbit_code_protocol"]
